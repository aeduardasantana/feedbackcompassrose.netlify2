name: Publicar Ruth na Locaweb
on:
  push:
    branches: [main]
    paths:
      - "public/avaliacoes/ruth/**"
      - ".github/workflows/publicar-ruth-locaweb.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-ruth-locaweb
  cancel-in-progress: false
jobs:
  enviar-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar HTML
        run: |
          test -s public/avaliacoes/ruth/index.html
          test -s public/avaliacoes/ruth/app.js
          test -s public/avaliacoes/ruth/dados.js
      - name: Instalar FTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publicar somente páginas da Ruth
        env:
          FTP_HOST: ${{ secrets.HOST }}
          FTP_USER: ${{ secrets.USER }}
          FTP_PASS: ${{ secrets.PASS }}
          RUTH_PASSWORD: ${{ secrets.AVALI_RUTH }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"
          test -n "$RUTH_PASSWORD"
          export LFTP_PASSWORD="$FTP_PASS"
          php -r 'file_put_contents("/tmp/ruth-config.php", "<?php return ".var_export(password_hash(getenv("RUTH_PASSWORD"), PASSWORD_DEFAULT), true).";\n");'
          lftp --env-password -u "$FTP_USER" "$FTP_HOST" <<'FTP'
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-allow yes
          set ssl:verify-certificate yes
          cd /public_html/feedback
          cd avaliacoes/ruth
          cd ../..
          mirror -R -a --verbose public/avaliacoes/ruth/ avaliacoes/ruth/
          put /tmp/ruth-config.php -o avaliacoes/ruth/.senha-config.php
          get avaliacoes/ruth/.senha-config.php -o /tmp/ruth-check.php
          bye
          FTP
          cmp -s /tmp/ruth-config.php /tmp/ruth-check.php || { echo "::error::A configuração de senha não foi gravada corretamente na Locaweb."; exit 1; }
          rm -f /tmp/ruth-check.php /tmp/ruth-config.php
      - name: Testar URL pública
        shell: bash
        run: |
          set -euo pipefail
          url="https://feedback.compassrosesystems.com.br/avaliacoes/ruth/"
          for n in 1 2 3; do
            if curl -fsSL --max-time 20 "$url" | grep -q 'Área reservada da consultora'; then
              echo "Portal da Ruth publicado."
              exit 0
            fi
            sleep 7
          done
          echo "::error::Upload executado, mas URL não confirmou o HTML esperado."
          exit 1
